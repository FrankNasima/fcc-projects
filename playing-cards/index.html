<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=">
</head>

<body>
  <main id="playing-cards">
  <div class="card">
  <div class="left">A ♠</div>
  <div class="middle">♠</div>
  <div class="right">A ♠</div>
  </div>
  <div class="card">
  <div class="left">K <span class="red">♦</span></div>
  <div class="middle"><span class="red">♦</span></div>
  <div class="right">K <span class="red">♦</span></div>
  </div>
  <div class="card">
  <div class="left">Q ♣</div>
  <div class="middle">♣</div>
  <div class="right">Q ♣</div>
  </div>
  <div class="card">
  <div class="left">J <span class="red">♥</span></div>
  <div class="middle"><span class="red">♥</span></div>
  <div class="right">J <span class="red">♥</span></div>
  </div>
  <div class="card">
  <div class="left">10 ♠</div>
  <div class="middle">♠</div>
  <div class="right">10 ♠</div>
  </div>
  </main>
</body>

</html>s
